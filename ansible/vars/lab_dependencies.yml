---
# Pacotes do control plane. O Ansible já deve estar instalado para executar
# o bootstrap; esta lista cobre o restante da infraestrutura do laboratório.
control_plane_packages:
  - dnf-plugins-core
  - git
  - rsync
  - curl
  - tar
  - gzip
  - bzip2
  - xz
  - vim-enhanced
  - man-db
  - man-pages
  - openssh-clients
  - createrepo_c

# Baseline das VMs de prática. A instalação é infraestrutura do laboratório,
# não parte da resolução dos exercícios.
#
# O conjunto permanece completo porque vários labs dependem dessas ferramentas
# e serviços. O bootstrap transfere os RPMs a partir do bastion e instala a
# baseline sem depender dos repositórios remotos de servera/serverb.
managed_baseline_packages:
  - openssh-server
  - openssh-clients
  - python3
  - sudo
  - bzip2
  - gzip
  - xz
  - tar
  - vim-enhanced
  - man-db
  - man-pages
  - rsync
  - tree
  - lsof
  - psmisc
  - acl
  - attr
  - policycoreutils-python-utils
  - setools-console
  - parted
  - lvm2
  - xfsprogs
  - e2fsprogs
  - nfs-utils
  - autofs
  - chrony
  - firewalld
  - NetworkManager
  - httpd

control_plane_required_commands:
  - ansible
  - ansible-playbook
  - git
  - ssh
  - rsync
  - curl
  - tar
  - gzip
  - bzip2
  - xz
  - python3
  - dnf
  - createrepo_c

managed_required_commands:
  - sshd
  - ssh
  - python3
  - sudo
  - dnf
  - rpm
  - tar
  - gzip
  - bzip2
  - xz
  - vim
  - man
  - getfacl
  - setfacl
  - getfattr
  - setfattr
  - semanage
  - restorecon
  - parted
  - pvcreate
  - vgcreate
  - lvcreate
  - mkfs.xfs
  - mkfs.ext4
  - showmount
  - automount
  - chronyc
  - firewall-cmd
  - nmcli
  - httpd
