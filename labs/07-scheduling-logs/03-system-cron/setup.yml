---
- name: Prepare obj07-03 cron lab
  hosts: servera
  gather_facts: false
  become: true
  vars: {root: /home/student/rhcsa-lab/obj07-03}
  tasks:
    - ansible.builtin.file: {path: "{{ root }}", state: absent}
    - ansible.builtin.file: {path: "{{ root }}/output", state: directory, owner: student, group: student, mode: "0755"}
    - ansible.builtin.file: {path: /etc/cron.d/rhcsa-report, state: absent}
    - ansible.builtin.systemd: {name: crond, state: started, enabled: true}
