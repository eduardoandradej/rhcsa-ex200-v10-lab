---
- name: Prepare obj07-02 tmpfiles lab
  hosts: servera
  gather_facts: false
  become: true
  vars: {root: /home/student/rhcsa-lab/obj07-02}
  tasks:
    - ansible.builtin.file: {path: "{{ root }}", state: absent}
    - ansible.builtin.file: {path: "{{ root }}/output", state: directory, owner: student, group: student, mode: "0755"}
    - ansible.builtin.file: {path: /etc/tmpfiles.d/rhcsa-momentary.conf, state: absent}
    - ansible.builtin.file: {path: /run/rhcsa-momentary, state: absent}
