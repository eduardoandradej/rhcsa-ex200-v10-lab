---
- name: Prepare obj07-08 integrated challenge
  hosts: serverb
  gather_facts: false
  become: true
  vars: {root: /home/student/rhcsa-lab/obj07-08}
  tasks:
    - ansible.builtin.file: {path: "{{ root }}", state: absent}
    - ansible.builtin.file: {path: "{{ root }}/output", state: directory, owner: student, group: student, mode: "0755"}
    - ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/etc/rsyslog.d/rhcsa-audit.conf, /etc/systemd/system/rhcsa-audit.service, /etc/systemd/system/rhcsa-audit.timer, /var/log/rhcsa-audit.log]
    - ansible.builtin.command: systemctl daemon-reload
      changed_when: true
    - ansible.builtin.systemd: {name: rsyslog, state: started, enabled: true}
