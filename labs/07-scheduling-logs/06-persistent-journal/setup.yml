---
- name: Prepare obj07-06 persistent journal lab
  hosts: servera
  gather_facts: false
  become: true
  vars:
    root: /home/student/rhcsa-lab/obj07-06
    state_dir: /var/lib/rhcsa-lab/obj07-06
  tasks:
    - ansible.builtin.file: {path: "{{ root }}", state: absent}
    - ansible.builtin.file: {path: "{{ root }}/output", state: directory, owner: student, group: student, mode: "0755"}
    - ansible.builtin.file: {path: "{{ state_dir }}", state: directory, mode: "0700"}
    - ansible.builtin.shell: 'if [ -d /var/log/journal ]; then echo yes; else echo no; fi'
      register: existed
      changed_when: false
    - ansible.builtin.copy: {dest: "{{ state_dir }}/journal-existed", content: "{{ existed.stdout | trim }}\n", mode: "0600"}
    - ansible.builtin.file: {path: /etc/systemd/journald.conf.d/99-rhcsa-persistent.conf, state: absent}
