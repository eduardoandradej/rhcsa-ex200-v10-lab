---
- name: Prepare obj03-02 local RPM inspection lab
  hosts: servera
  gather_facts: false
  become: true
  vars:
    root: /home/student/rhcsa-lab/obj03-02
  tasks:
    - ansible.builtin.command: rpm -e rhcsa-inspect
      register: erase_result
      changed_when: erase_result.rc == 0
      failed_when: false

    - ansible.builtin.file:
        path: "{{ root }}"
        state: absent

    - ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: student
        group: student
        mode: "0755"
      loop:
        - "{{ root }}"
        - "{{ root }}/output"
        - "{{ root }}/extracted"

    - ansible.builtin.copy:
        src: /var/lib/rhcsa-lab/obj03/packages/rhcsa-inspect-1.0-1.noarch.rpm
        dest: "{{ root }}/rhcsa-inspect-1.0-1.noarch.rpm"
        remote_src: true
        owner: student
        group: student
        mode: "0644"
