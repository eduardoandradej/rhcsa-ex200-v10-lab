---
- name: Prepare obj03-07 DNF history lab
  hosts: servera
  gather_facts: false
  become: true
  vars:
    root: /home/student/rhcsa-lab/obj03-07
  tasks:
    - ansible.builtin.command: rpm -e rhcsa-history
      changed_when: false
      failed_when: false

    - ansible.builtin.file:
        path: "{{ root }}"
        state: absent

    - ansible.builtin.file:
        path: "{{ root }}/output"
        state: directory
        owner: student
        group: student
        mode: "0755"

    - ansible.builtin.copy:
        dest: /etc/yum.repos.d/rhcsa-history.repo
        mode: "0644"
        content: |
          [rhcsa-history-repo]
          name=RHCSA History Repository
          baseurl=file:///var/lib/rhcsa-lab/obj03/repos/base
          enabled=1
          gpgcheck=0

    - ansible.builtin.command: dnf -q clean metadata
      changed_when: true
