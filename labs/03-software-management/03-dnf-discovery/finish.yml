---
- name: Finish obj03-03 DNF discovery lab
  hosts: servera
  gather_facts: false
  become: true
  tasks:
    - ansible.builtin.command: rpm -e rhcsa-toolkit
      register: erase_result
      changed_when: erase_result.rc == 0
      failed_when: false
    - ansible.builtin.file:
        path: /etc/yum.repos.d/rhcsa-discovery.repo
        state: absent
    - ansible.builtin.file:
        path: /home/student/rhcsa-lab/obj03-03
        state: absent
