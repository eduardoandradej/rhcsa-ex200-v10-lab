---
- name: Finish obj05-05 nice and renice lab
  hosts: servera
  gather_facts: false
  become: true

  tasks:
    - ansible.builtin.shell: |
        pkill -TERM -f '^rhcsa-nice-start( |$)' 2>/dev/null || true
        pkill -TERM -f '^rhcsa-nice-change( |$)' 2>/dev/null || true
      changed_when: false

    - ansible.builtin.file:
        path: /home/student/rhcsa-lab/obj05-05
        state: absent
