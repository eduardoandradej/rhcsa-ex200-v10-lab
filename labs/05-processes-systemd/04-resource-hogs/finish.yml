---
- name: Finish obj05-04 resource monitoring lab
  hosts: servera
  gather_facts: false
  become: true

  tasks:
    - ansible.builtin.shell: |
        pkill -TERM -f '^rhcsa-cpu-hog( |$)' 2>/dev/null || true
        pkill -TERM -f '^rhcsa-mem-hog( |$)' 2>/dev/null || true
        rm -f /run/rhcsa-cpu-hog.pid /run/rhcsa-mem-hog.pid
      changed_when: false

    - ansible.builtin.file:
        path: /home/student/rhcsa-lab/obj05-04
        state: absent
