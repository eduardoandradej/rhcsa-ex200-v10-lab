---
- name: Finish obj10-07
  hosts: servera
  gather_facts: false
  become: true
  vars:
    state_dir: /var/lib/rhcsa-lab/obj10-07
  tasks:
    - ansible.builtin.service:
        name: httpd
        state: stopped
      failed_when: false

    - ansible.builtin.command:
        argv: [semanage, port, -d, -t, http_port_t, -p, tcp, "48888"]
      failed_when: false
      changed_when: false

    - ansible.builtin.file:
        path: /etc/httpd/conf.d/rhcsa10-port.conf
        state: absent

    - name: Restore original httpd runtime state
      ansible.builtin.shell: |
        if grep -qx active "{{ state_dir }}/httpd-active" 2>/dev/null; then
          systemctl start httpd
        else
          systemctl stop httpd || true
        fi
      changed_when: true
      failed_when: false

    - ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /home/student/rhcsa-lab/obj10-07
        - "{{ state_dir }}"
