---
- name: Prepare obj10-09 integrated security challenge
  hosts: servera
  gather_facts: false
  become: true
  vars:
    state_dir: /var/lib/rhcsa-lab/obj10-09
    training_port: "48889"
  tasks:
    - ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - ansible.builtin.shell: |
        systemctl is-active httpd > "{{ state_dir }}/httpd-active" || true
      changed_when: false

    - name: Determine active firewall zone
      ansible.builtin.shell: |
        set -Eeuo pipefail
        iface="$(ip -o route show default | awk '{print $5; exit}')"
        zone="$(firewall-cmd --get-zone-of-interface="$iface")"
        if test -z "$zone" || test "$zone" = "no zone"; then
          zone="$(firewall-cmd --get-default-zone)"
        fi
        printf '%s\n' "$zone" > "{{ state_dir }}/zone"
      args:
        executable: /bin/bash
      changed_when: false

    - ansible.builtin.command:
        argv: [semanage, fcontext, -d, '/srv/rhcsa10-final(/.*)?']
      failed_when: false
      changed_when: false

    - ansible.builtin.command:
        argv: [semanage, port, -d, -t, http_port_t, -p, tcp, "{{ training_port }}"]
      failed_when: false
      changed_when: false

    - name: Refuse to repurpose a policy-defined training port
      ansible.builtin.shell: |
        if semanage port -l | grep -Eq '(^|[[:space:],]){{ training_port }}([[:space:],-]|$)'; then
          echo "port {{ training_port }} already appears in SELinux policy"
          exit 1
        fi
      changed_when: false

    - name: Ensure firewall training port starts closed
      ansible.builtin.shell: |
        zone="$(cat "{{ state_dir }}/zone")"
        firewall-cmd --zone="$zone" --remove-port={{ training_port }}/tcp >/dev/null 2>&1 || true
        firewall-cmd --permanent --zone="$zone" --remove-port={{ training_port }}/tcp >/dev/null 2>&1 || true
        firewall-cmd --reload
      changed_when: true

    - ansible.builtin.file:
        path: /srv/rhcsa10-final
        state: absent

    - ansible.builtin.file:
        path: /srv/rhcsa10-final
        state: directory
        owner: root
        group: root
        mode: "0755"

    - ansible.builtin.copy:
        dest: /srv/rhcsa10-final/index.html
        content: "OBJ10 integrated security PASS\n"
        owner: root
        group: root
        mode: "0644"

    - ansible.builtin.command:
        argv: [chcon, -R, -t, default_t, /srv/rhcsa10-final]
      changed_when: true

    - ansible.builtin.copy:
        dest: /etc/httpd/conf.d/rhcsa10-final.conf
        content: |
          Listen {{ training_port }}
          Alias /secure10/ "/srv/rhcsa10-final/"
          <Directory "/srv/rhcsa10-final">
              Require all granted
          </Directory>
        owner: root
        group: root
        mode: "0644"

    - ansible.builtin.service:
        name: httpd
        state: stopped

    - ansible.builtin.file:
        path: /home/student/rhcsa-lab/obj10-09
        state: absent

    - ansible.builtin.file:
        path: /home/student/rhcsa-lab/obj10-09/output
        state: directory
        owner: student
        group: student
        mode: "0755"
