---
- name: Prepare obj10-04 SELinux Boolean
  hosts: servera
  gather_facts: false
  become: true
  vars:
    state_dir: /var/lib/rhcsa-lab/obj10-04
    boolean_name: httpd_enable_homedirs
  tasks:
    - ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Save current and persistent Boolean values
      ansible.builtin.shell: |
        set -Eeuo pipefail
        current="$(getsebool {{ boolean_name }} | awk '{print $3}')"
        persistent="$(semanage boolean -l | awk '$1=="{{ boolean_name }}"{gsub(/[()]/,"",$4); print $4}')"
        printf '%s %s\n' "$current" "$persistent" > "{{ state_dir }}/boolean-state"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Force deterministic Boolean baseline
      ansible.builtin.command:
        argv: [setsebool, -P, "{{ boolean_name }}", "off"]
      changed_when: true

    - ansible.builtin.file:
        path: /home/student/rhcsa-lab/obj10-04
        state: absent

    - ansible.builtin.file:
        path: /home/student/rhcsa-lab/obj10-04/output
        state: directory
        owner: student
        group: student
        mode: "0755"
