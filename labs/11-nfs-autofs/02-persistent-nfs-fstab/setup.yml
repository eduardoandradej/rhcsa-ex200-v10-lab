---
- name: Prepare obj11-02 persistent NFS
  hosts: servera
  gather_facts: false
  become: true
  vars:
    state_dir: /var/lib/rhcsa-lab/obj11-02
  tasks:
    - ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - ansible.builtin.copy:
        src: /etc/fstab
        dest: "{{ state_dir }}/fstab"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - ansible.builtin.command:
        argv: [umount, /mnt/rhcsa11-persist]
      failed_when: false
      changed_when: false

    - ansible.builtin.file:
        path: /mnt/rhcsa11-persist
        state: directory
        owner: root
        group: root
        mode: "0755"

    - ansible.builtin.file:
        path: /home/student/rhcsa-lab/obj11-02
        state: absent

    - ansible.builtin.file:
        path: /home/student/rhcsa-lab/obj11-02/output
        state: directory
        owner: student
        group: student
        mode: "0755"
