---
- name: Finish obj02-06 sudo lab
  hosts: servera
  gather_facts: false
  become: true
  tasks:
    - ansible.builtin.file:
        path: /etc/sudoers.d/opsadmin
        state: absent
    - ansible.builtin.user:
        name: svcadmin
        state: absent
        remove: true
    - ansible.builtin.group:
        name: opsadmin
        state: absent
