---
- name: Prepare obj02-02 user management lab
  hosts: servera
  gather_facts: false
  become: true
  tasks:
    - name: Remove exercise users
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: true
      loop: [opsalpha, opsbeta, opstemp]
    - name: Remove moved home
      ansible.builtin.file:
        path: /srv/opsbeta
        state: absent
