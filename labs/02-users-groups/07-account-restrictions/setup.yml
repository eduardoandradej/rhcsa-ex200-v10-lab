---
- name: Prepare obj02-07 account restriction lab
  hosts: servera
  gather_facts: false
  become: true

  tasks:
    - name: Remove exercise users
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: true
      loop:
        - departed1
        - serviceacct
        - tempcontract
        - recoveruser

    - name: Create exercise users
      ansible.builtin.user:
        name: "{{ item }}"
        shell: /bin/bash
        state: present
      loop:
        - departed1
        - serviceacct
        - tempcontract
        - recoveruser

    - name: Set laboratory password for each exercise user
      ansible.builtin.command: chpasswd
      args:
        stdin: "{{ item }}:redhat"
        stdin_add_newline: false
      loop:
        - departed1
        - serviceacct
        - tempcontract
        - recoveruser
      changed_when: true

    - name: Start recoveruser locked and expired
      ansible.builtin.command: usermod -L -e 1 recoveruser
      changed_when: true
