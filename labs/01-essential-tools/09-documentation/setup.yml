---
- name: Prepare obj01-09 documentation lab
  hosts: servera
  gather_facts: false
  become: true

  vars:
    root: /home/student/rhcsa-lab/obj01-09

  tasks:
    - name: Remove previous exercise data
      ansible.builtin.file:
        path: "{{ root }}"
        state: absent

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ root }}/output"
        state: directory
        owner: student
        group: student
        mode: "0755"

    - name: Refresh manual page database
      ansible.builtin.command: mandb -q
      changed_when: false
