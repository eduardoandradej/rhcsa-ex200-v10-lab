---
- name: Finish obj08-10
  hosts: servera
  gather_facts: false
  become: true
  vars:
    lab_root: /home/student/rhcsa-lab/obj08-10
    state_dir: /var/lib/rhcsa-lab/obj08-10
  tasks:
    - name: Restore fstab baseline
      ansible.builtin.copy:
        src: "{{ state_dir }}/fstab"
        dest: /etc/fstab
        remote_src: true
        mode: "0644"

    - name: Reload systemd after fstab restore
      ansible.builtin.command: systemctl daemon-reload
      changed_when: true

    - name: Reset only authorized scratch disks
      ansible.builtin.command: /usr/local/sbin/rhcsa-storage-reset /dev/vdc /dev/vdd
      changed_when: true

    - ansible.builtin.file:
        path: "{{ lab_root }}"
        state: absent

    - ansible.builtin.file:
        path: "{{ state_dir }}"
        state: absent
