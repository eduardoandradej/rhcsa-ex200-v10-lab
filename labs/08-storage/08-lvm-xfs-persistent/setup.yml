---
- name: Prepare obj08-08
  hosts: servera
  gather_facts: false
  become: true
  vars:
    lab_root: /home/student/rhcsa-lab/obj08-08
    state_dir: /var/lib/rhcsa-lab/obj08-08
  tasks:

    - name: Install OBJ08 storage guard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../ansible/files/rhcsa-storage-guard"
        dest: /usr/local/sbin/rhcsa-storage-guard
        owner: root
        group: root
        mode: "0755"

    - name: Install OBJ08 storage reset utility
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../ansible/files/rhcsa-storage-reset"
        dest: /usr/local/sbin/rhcsa-storage-reset
        owner: root
        group: root
        mode: "0755"
    - ansible.builtin.file:
        path: "{{ lab_root }}"
        state: absent

    - ansible.builtin.file:
        path: "{{ lab_root }}/output"
        state: directory
        owner: student
        group: student
        mode: "0755"

    - ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        mode: "0700"

    - name: Safety guard /dev/vdc
      ansible.builtin.command: /usr/local/sbin/rhcsa-storage-guard blank /dev/vdc
      changed_when: false

    - name: Save fstab baseline
      ansible.builtin.copy:
        src: /etc/fstab
        dest: "{{ state_dir }}/fstab"
        remote_src: true
        mode: "0600"

    - name: Prepare LVM objects
      ansible.builtin.shell: |
        parted -s /dev/vdc mklabel gpt
        parted -s /dev/vdc mkpart lvm08 1MiB 4097MiB
        parted -s /dev/vdc set 1 lvm on
        udevadm settle --timeout=15
        pvcreate -ff -y /dev/vdc1
        vgcreate rhcsa_vgdata /dev/vdc1
        lvcreate --yes --wipesignatures y -L 2G -n rhcsa_lvdata rhcsa_vgdata
      changed_when: true
    - ansible.builtin.file:
        path: /lvdata
        state: directory
        mode: "0755"

