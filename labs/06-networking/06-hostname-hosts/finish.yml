---
- name: Finish obj06-06
  hosts: servera
  gather_facts: false
  become: true
  vars: { state_dir: /var/lib/rhcsa-lab/obj06-06 }
  tasks:
    - name: Restore hostname
      ansible.builtin.shell: 'hostnamectl set-hostname "$(cat {{ state_dir }}/hostname)"'
      changed_when: true
    - name: Restore hosts
      ansible.builtin.copy: { src: "{{ state_dir }}/hosts", dest: /etc/hosts, remote_src: true, owner: root, group: root, mode: "0644" }

    - name: Remove training NetworkManager profiles
      ansible.builtin.shell: |
        for uuid in $(nmcli -t -f UUID con show 2>/dev/null); do
          ifname=$(nmcli -g connection.interface-name con show uuid "$uuid" 2>/dev/null || true)
          case "$ifname" in
            ex200a|ex200b) nmcli con delete uuid "$uuid" >/dev/null 2>&1 || true ;;
          esac
        done
      changed_when: false

    - name: Remove training veth pair
      ansible.builtin.shell: |
        ip link del ex200a 2>/dev/null || true
      changed_when: false
    - ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/home/student/rhcsa-lab/obj06-06, "{{ state_dir }}"]
