---
- name: Prepare obj04-02 file-test lab
  hosts: servera
  gather_facts: false
  become: true
  vars:
    root: /home/student/rhcsa-lab/obj04-02
  tasks:
    - ansible.builtin.file:
        path: "{{ root }}"
        state: absent

    - ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: student
        group: student
        mode: "0755"
      loop:
        - "{{ root }}"
        - "{{ root }}/assets"
        - "{{ root }}/assets/data"

    - ansible.builtin.copy:
        dest: "{{ root }}/assets/config.ini"
        owner: student
        group: student
        mode: "0644"
        content: |
          mode=training
