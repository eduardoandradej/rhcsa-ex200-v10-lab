---
- name: Prepare obj04-08 integrated shell scripting challenge
  hosts: serverb
  gather_facts: false
  become: true
  vars:
    root: /home/student/rhcsa-lab/obj04-08
  tasks:
    - ansible.builtin.file:
        path: "{{ root }}"
        state: absent

    - ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: student
        group: student
        mode: "0755"
      loop:
        - "{{ root }}"
        - "{{ root }}/assets"
        - "{{ root }}/output"

    - ansible.builtin.copy:
        dest: "{{ root }}/assets/users.list"
        owner: student
        group: student
        mode: "0644"
        content: |
          root
          student
          nobody
          rhcsa-missing-user
