---
- name: Finish obj12-06
  hosts: servera
  gather_facts: false
  become: true
  vars:
    state_dir: /var/lib/rhcsa-lab/obj12-06
  tasks:
    - ansible.builtin.service:
        name: autofs
        state: stopped
      failed_when: false

    - ansible.builtin.command:
        argv: [userdel, -r, operator12]
      failed_when: false
      changed_when: false

    - ansible.builtin.command:
        argv: [groupdel, opsfinal12]
      failed_when: false
      changed_when: false

    - ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/auto.master.d/final12.autofs
        - /etc/auto.final12
        - /remote12-final
        - /srv/final12
        - /usr/local/bin/final-report12
        - /etc/cron.d/final12
        - /home/student/rhcsa-lab/obj12-06

    - name: Restore AutoFS enabled state
      ansible.builtin.shell: |
        if grep -qx enabled "{{ state_dir }}/autofs-enabled" 2>/dev/null; then
          systemctl enable autofs
        else
          systemctl disable autofs >/dev/null 2>&1 || true
        fi
      changed_when: false
      failed_when: false

    - name: Restore AutoFS active state
      ansible.builtin.shell: |
        if grep -qx active "{{ state_dir }}/autofs-active" 2>/dev/null; then
          systemctl start autofs
        else
          systemctl stop autofs >/dev/null 2>&1 || true
        fi
      changed_when: false
      failed_when: false

    - ansible.builtin.file:
        path: "{{ state_dir }}"
        state: absent
